# The live race server: one Durable Object per room, close to the players. `npm run dev` runs it on this computer
# (no account needed); `npm run deploy` puts it online (needs `npx wrangler login` once).
name = "nehorace-live"
main = "room.js"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
